<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account | Demo Perfumes</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* PROFESSIONAL AUTH PAGE */

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .auth-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .auth-header {
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
        }

        .auth-field input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .auth-field input:focus {
            border-color: #1c1c1c;
        }

        .auth-actions {
            margin-top: 25px;
        }

        .auth-actions button {
            width: 100%;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .register-btn {
            margin-top: 12px;
            background: transparent;
            border: 1px solid #ccc;
            color: #333;
        }

        .auth-footer {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
            text-align: center;
            line-height: 1.6;
        }

        .auth-footer a {
            color: #1c1c1c;
            text-decoration: none;
            font-weight: 600;
        }

        @media(max-width: 480px) {
            .auth-card {
                padding: 32px 26px;
            }
        }
    </style>
</head>
<body>

<div class="auth-layout">
    <div class="auth-card">

        <!-- HEADER -->
        <div class="auth-header">
            <h1>Account Access</h1>
            <p>
                Sign in to your account or create a new one
                to continue shopping with Demo Perfumes.
            </p>
        </div>

        <!-- EMAIL -->
        <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>

        <!-- PASSWORD -->
        <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <!-- ACTIONS -->
        <div class="auth-actions">
            <button onclick="login()">Sign In</button>
            <button class="register-btn" onclick="register()">Create Account</button>
        </div>

        <!-- FOOTER -->
        <div class="auth-footer">
            By continuing, you agree to Demo’s
            <a href="#">Terms of Service</a> and
            <a href="#">Privacy Policy</a>.
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
